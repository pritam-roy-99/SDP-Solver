[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "npa-bff-toolkit"
version = "0.1.0"
description = "Research Python implementation of multipartite Bell-NPA and BFF conditional entropy SDPs"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["quantum-information", "Bell-nonlocality", "NPA", "BFF", "semidefinite-programming"]
dependencies = ["numpy>=1.23", "scipy>=1.9"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
sdp = ["cvxpy>=1.4"]
test = ["pytest>=7"]
all = ["cvxpy>=1.4", "pytest>=7", "jupyter>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
